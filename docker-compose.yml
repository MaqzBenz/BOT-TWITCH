services:
  cocobot:
    build: .
    image: cocobot:latest
    container_name: cocobot
    platform: linux/arm64
    restart: unless-stopped
    # Les variables viennent du .env (docker compose) OU des "Environment variables" de la stack Portainer.
    environment:
      DATA_DIR: /data
      APP_PORT: ${APP_PORT:-12080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_BOT_TOKEN: ${TWITCH_BOT_TOKEN:-}
      TWITCH_REFRESH_TOKEN: ${TWITCH_REFRESH_TOKEN:-}
      TWITCH_CHANNEL: ${TWITCH_CHANNEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-12080}:${APP_PORT:-12080}"
    volumes:
      - cocobot_data:/data   # SQLite + logs + tokens rafraîchis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  cocobot_data:
